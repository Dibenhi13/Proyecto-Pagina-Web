<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>System Instability | The Lost Ship</title>


    <!-- Montserrat temporal -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="scene-04.css"
    >

</head>


<body>


    <!-- ==================================================
         ESCENA 04
         CORRUPTED SURVEILLANCE INTERFACE
    =================================================== -->

    <main
        id="scene-04"
        class="surveillance-scene corrupted-scene"
    >


        <!-- ==================================================
             FONDO / INTERFERENCIA
        =================================================== -->

        <div
            class="system-background"
            aria-hidden="true"
        ></div>


        <div
            class="system-scanlines"
            aria-hidden="true"
        ></div>


        <div
            id="system-noise"
            class="system-noise"
            aria-hidden="true"
        ></div>


        <!-- Líneas de interferencia -->

        <div
            id="interference-line-01"
            class="interference-line interference-line-01"
            aria-hidden="true"
        ></div>

        <div
            id="interference-line-02"
            class="interference-line interference-line-02"
            aria-hidden="true"
        ></div>

        <div
            id="interference-line-03"
            class="interference-line interference-line-03"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             INTERFAZ PRINCIPAL
        =================================================== -->

        <section
            id="surveillance-interface"
            class="surveillance-interface"
        >


            <!-- ==============================================
                 HEADER
            =============================================== -->

            <header
                id="system-header"
                class="system-header"
            >


                <div
                    class="status-item status-connection"
                >

                    <span
                        id="connection-status"
                        class="status-value"
                    >
                        CONNECTED
                    </span>

                </div>


                <div
                    class="status-item status-signal"
                >

                    <span
                        id="signal-label"
                        class="status-label"
                    >
                        SIGNAL STRENGTH:
                    </span>

                    <span
                        id="signal-strength"
                        class="status-value"
                    >
                        64%
                    </span>

                </div>


                <div
                    class="status-item status-data"
                >

                    <span
                        id="data-label"
                        class="status-label"
                    >
                        DATA STREAM:
                    </span>

                    <span
                        id="data-status"
                        class="status-value"
                    >
                        ACTIVE
                    </span>

                </div>


            </header>



            <!-- ==============================================
                 CUERPO
            =============================================== -->

            <div
                class="system-body"
            >


                <!-- ==================================================
                     CAMERAS
                =================================================== -->

                <aside
                    id="camera-panel"
                    class="camera-panel"
                >


                    <h2
                        id="camera-panel-title"
                        class="panel-title"
                    >
                        CAMERAS
                    </h2>


                    <nav
                        class="camera-list"
                        aria-label="Surveillance cameras"
                    >


                        <button
                            class="camera-button locked-camera active"
                            type="button"
                            data-camera="cam01"
                        >
                            CAM 01
                        </button>


                        <button
                            class="camera-button locked-camera"
                            type="button"
                            data-camera="cam02"
                        >
                            CAM 02
                        </button>


                        <button
                            class="camera-button locked-camera"
                            type="button"
                            data-camera="cam03"
                        >
                            CAM 03
                        </button>


                    </nav>



                    <!-- Mensaje de acceso denegado -->

                    <div
                        id="camera-denied-message"
                        class="denied-message"
                        aria-live="polite"
                    >
                        ACCESS DENIED
                    </div>


                </aside>



                <!-- ==================================================
                     LIVE FEED
                =================================================== -->

                <section
                    id="live-feed-panel"
                    class="live-feed-panel"
                >


                    <!-- Header del feed -->

                    <div
                        class="feed-header"
                    >

                        <span
                            id="live-feed-label"
                            class="live-feed-label"
                        >
                            LIVE FEED
                        </span>


                        <span
                            class="live-indicator"
                            aria-hidden="true"
                        >

                            <span
                                id="live-dot"
                                class="live-dot"
                            ></span>

                        </span>

                    </div>



                    <!-- Video -->

                    <div
                        id="video-container"
                        class="video-container"
                    >


                        <video
                            id="camera-video"
                            class="camera-video"
                            autoplay
                            muted
                            loop
                            playsinline
                        ></video>



                        <!-- Placeholder por si no está el asset -->

                        <div
                            id="video-placeholder"
                            class="video-placeholder"
                        >

                            <span>
                                CAM 01
                            </span>

                        </div>



                        <!-- Capas del feed -->

                        <div
                            class="video-scanlines"
                            aria-hidden="true"
                        ></div>


                        <div
                            id="video-noise"
                            class="video-noise"
                            aria-hidden="true"
                        ></div>


                        <div
                            id="video-static"
                            class="video-static"
                            aria-hidden="true"
                        ></div>



                        <!-- Freeze / corte negro -->

                        <div
                            id="video-blackout"
                            class="video-blackout"
                            aria-hidden="true"
                        ></div>



                        <!-- Anomalía -->

                        <div
                            id="feed-anomaly"
                            class="feed-anomaly"
                            aria-hidden="true"
                        ></div>



                        <!-- Glitch text -->

                        <div
                            id="feed-error-message"
                            class="feed-error-message"
                            aria-hidden="true"
                        >
                            SIGNAL ERROR
                        </div>


                    </div>



                    <!-- Footer -->

                    <div
                        class="feed-footer"
                    >

                        <span
                            id="camera-name"
                            class="camera-name"
                        >
                            EXTERNAL CAM 01
                        </span>

                    </div>


                </section>



                <!-- ==================================================
                     SYSTEM LOGS
                =================================================== -->

                <aside
                    id="logs-panel"
                    class="logs-panel"
                >


                    <div
                        class="logs-content"
                    >


                        <h2
                            id="logs-title"
                            class="panel-title"
                        >
                            SYSTEM LOGS
                        </h2>



                        <div
                            id="system-logs"
                            class="system-logs"
                            aria-live="polite"
                        >


                            <p
                                id="system-log-01"
                                class="system-log"
                            >

                                <span class="log-arrow">
                                    &gt;
                                </span>

                                <span
                                    class="system-log-text"
                                ></span>

                            </p>


                            <p
                                id="system-log-02"
                                class="system-log"
                            >

                                <span class="log-arrow">
                                    &gt;
                                </span>

                                <span
                                    class="system-log-text"
                                ></span>

                            </p>


                            <p
                                id="system-log-03"
                                class="system-log warning-log"
                            >

                                <span class="log-arrow">
                                    &gt;
                                </span>

                                <span
                                    class="system-log-text"
                                ></span>

                            </p>


                            <p
                                id="system-log-04"
                                class="system-log corrupted-system-log"
                            >

                                <span class="log-arrow">
                                    &gt;
                                </span>

                                <span
                                    class="system-log-text"
                                ></span>

                            </p>



                            <!-- Cursor -->

                            <p
                                id="system-log-cursor"
                                class="system-log log-cursor"
                                aria-hidden="true"
                            >

                                &gt;

                                <span
                                    id="cursor-block"
                                    class="cursor-block"
                                >
                                    █
                                </span>

                            </p>


                        </div>


                    </div>



                    <!-- ==========================================
                         ACCESS LOGS
                    =========================================== -->

                    <div
                        class="access-logs-container"
                    >

                        <button
                            id="access-logs-button"
                            class="access-logs-button"
                            type="button"
                        >
                            ACCESS LOGS
                        </button>

                    </div>


                </aside>


            </div>


        </section>



        <!-- ==================================================
             ACCESS DENIED GLOBAL
        =================================================== -->

        <div
            id="system-denied-message"
            class="system-denied-message"
            aria-hidden="true"
        >

            <span
                id="system-denied-text"
            >
                ACCESS DENIED
            </span>

        </div>



        <!-- ==================================================
             ARCHIVED LOGS MODAL
        =================================================== -->

        <section
            id="archived-logs-modal"
            class="archived-logs-modal"
            aria-hidden="true"
        >


            <div
                id="archived-logs-window"
                class="archived-logs-window"
            >


                <!-- ==========================================
                     HEADER
                =========================================== -->

                <header
                    class="archived-logs-header"
                >


                    <h2
                        id="archived-logs-title"
                    >
                        ARCHIVED LOGS
                    </h2>


                    <button
                        id="close-logs-button"
                        class="close-logs-button"
                        type="button"
                        aria-label="Close archived logs"
                    >
                        ×
                    </button>


                </header>



                <!-- ==========================================
                     LISTA DE ARCHIVOS
                =========================================== -->

                <div
                    class="archived-logs-list"
                >


                    <!-- LOG 05 -->

                    <button
                        class="archived-log-item"
                        type="button"
                        data-log="05"
                    >

                        <span
                            class="log-id"
                        >
                            LOG_05
                        </span>

                        <span
                            class="log-description"
                        >
                            MISSION REPORT
                        </span>

                    </button>



                    <!-- LOG 06 -->

                    <button
                        class="archived-log-item"
                        type="button"
                        data-log="06"
                    >

                        <span
                            class="log-id"
                        >
                            LOG_06
                        </span>

                        <span
                            class="log-description"
                        >
                            NAVIGATION UPDATE
                        </span>

                    </button>



                    <!-- LOG 07 -->

                    <button
                        class="archived-log-item"
                        type="button"
                        data-log="07"
                    >

                        <span
                            class="log-id"
                        >
                            LOG_07
                        </span>

                        <span
                            class="log-description"
                        >
                            CREW STATUS
                        </span>

                    </button>



                    <!-- LOG 08 -->

                    <button
                        class="archived-log-item corrupted"
                        type="button"
                        data-log="08"
                    >

                        <span
                            class="log-id"
                        >
                            LOG_08
                        </span>

                        <span
                            class="log-description"
                        >
                            [CORRUPTED]
                        </span>

                    </button>


                </div>



                <!-- ==================================================
                     CONTENIDO DEL LOG
                =================================================== -->

                <div
                    id="log-details"
                    class="log-details"
                    aria-live="polite"
                >


                    <!-- Placeholder -->

                    <div
                        id="log-details-placeholder"
                        class="log-details-placeholder"
                    >
                        SELECT LOG FILE
                    </div>



                    <!-- Contenido -->

                    <div
                        id="log-details-content"
                        class="log-details-content"
                    >


                        <!-- ==========================================
                             TÍTULO
                        =========================================== -->

                        <div
                            class="log-details-heading"
                        >

                            <span
                                id="selected-log-id"
                                class="selected-log-id"
                            ></span>


                            <span
                                id="selected-log-title"
                                class="selected-log-title"
                            ></span>

                        </div>



                        <!-- ==========================================
                             METADATA
                        =========================================== -->

                        <div
                            class="log-details-metadata"
                        >


                            <p>

                                <span
                                    id="log-date-label"
                                    class="metadata-label"
                                >
                                    DATE:
                                </span>

                                <span
                                    id="selected-log-date"
                                ></span>

                            </p>


                            <p>

                                <span
                                    id="log-status-label"
                                    class="metadata-label"
                                >
                                    STATUS:
                                </span>

                                <span
                                    id="selected-log-status"
                                ></span>

                            </p>


                        </div>



                        <!-- ==========================================
                             BODY
                        =========================================== -->

                        <div
                            id="selected-log-body"
                            class="selected-log-body"
                        ></div>



                        <!-- ==================================================
                             AUDIO — SOLO LOG_08
                        =================================================== -->

                        <div
                            id="corrupted-audio-container"
                            class="corrupted-audio-container"
                        >


                            <div
                                id="audio-warning"
                                class="audio-warning"
                            >
                                AUDIO FRAGMENT AVAILABLE
                            </div>


                            <button
                                id="play-corrupted-audio"
                                class="play-corrupted-audio"
                                type="button"
                            >

                                <span
                                    id="corrupted-audio-text"
                                >
                                    PLAY AUDIO
                                </span>

                            </button>



                            <!-- Visualización -->

                            <div
                                id="audio-status"
                                class="audio-status"
                                aria-hidden="true"
                            >


                                <span
                                    id="audio-status-label"
                                    class="audio-status-label"
                                >
                                    AUDIO STREAM
                                </span>


                                <div
                                    id="audio-signal"
                                    class="audio-signal"
                                >

                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>

                                </div>


                            </div>


                        </div>


                    </div>


                </div>


            </div>


        </section>



        <!-- ==================================================
             AUDIO
        =================================================== -->

        <audio
            id="corrupted-audio"
            preload="metadata"
        >

            <source
                src="../../assets/audio/AUDIO_TEST.mp3"
                type="audio/mpeg"
            >

        </audio>



        <!-- ==================================================
             GLITCH LAYERS
        =================================================== -->

        <div
            id="glitch-layer-01"
            class="glitch-layer glitch-layer-01"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-02"
            class="glitch-layer glitch-layer-02"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-03"
            class="glitch-layer glitch-layer-03"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             FLASH
        =================================================== -->

        <div
            id="system-flash"
            class="system-flash"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             TRANSICIÓN FUTURA
        =================================================== -->

        <div
            id="scene-transition"
            class="scene-transition"
            aria-hidden="true"
        ></div>


    </main>



    <!-- ==================================================
         GSAP
    =================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>


    <!-- ==================================================
         ANIMACIONES
    =================================================== -->

    <script
        src="scene-04-animations.js"
    ></script>


    <!-- ==================================================
         LÓGICA
    =================================================== -->

    <script
        src="scene-04.js"
    ></script>


</body>

</html>
