<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connection Established | The Lost Ship</title>


    <!-- Montserrat temporal -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS COMPARTIDO -->

    <link
        rel="stylesheet"
        href="scene-10.css"
    >

</head>


<body>


    <!-- ==================================================
         SCENE 10 — AUTHORIZE ENDING
         Connection / Transfer
    =================================================== -->

    <main
        id="scene-10-authorize"
        class="ending-scene ending-authorize"
    >


        <!-- ==================================================
             BACKGROUND
        =================================================== -->

        <div
            id="ending-background"
            class="ending-background"
            aria-hidden="true"
        ></div>


        <div
            id="ending-scanlines"
            class="ending-scanlines"
            aria-hidden="true"
        ></div>


        <div
            id="ending-noise"
            class="ending-noise"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             MAIN FRAME
        =================================================== -->

        <section
            id="ending-frame"
            class="ending-frame"
        >


            <!-- ==============================================
                 MAIN CONTENT
            =============================================== -->

            <div
                id="ending-content"
                class="ending-content"
            >


                <section
                    id="authorize-ending-message"
                    class="ending-message-section"
                    aria-live="polite"
                >


                    <!--
                        Este elemento será reutilizado
                        por JS para mostrar cada mensaje
                        del final AUTHORIZE.
                    -->

                    <p
                        id="authorize-message"
                        class="ending-main-message"
                    >
                    </p>


                </section>


            </div>


        </section>



        <!-- ==================================================
             GHOST TEXT
             Appears during transfer / corruption
        =================================================== -->

        <div
            id="ghost-text-01"
            class="ending-ghost-text ending-ghost-text-01"
            aria-hidden="true"
        >
            EXTERNAL HOST DETECTED
        </div>


        <div
            id="ghost-text-02"
            class="ending-ghost-text ending-ghost-text-02"
            aria-hidden="true"
        >
            TRANSFER COMPLETE
        </div>



        <!-- ==================================================
             INTERFERENCE LINES
        =================================================== -->

        <div
            id="interference-line-01"
            class="interference-line interference-line-01"
            aria-hidden="true"
        ></div>


        <div
            id="interference-line-02"
            class="interference-line interference-line-02"
            aria-hidden="true"
        ></div>


        <div
            id="interference-line-03"
            class="interference-line interference-line-03"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             GLITCH LAYERS
        =================================================== -->

        <div
            id="glitch-layer-01"
            class="glitch-layer glitch-layer-01"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-02"
            class="glitch-layer glitch-layer-02"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-03"
            class="glitch-layer glitch-layer-03"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-04"
            class="glitch-layer glitch-layer-04"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             GREEN FLASH
        =================================================== -->

        <div
            id="ending-flash"
            class="ending-flash"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             WHITEOUT
        =================================================== -->

        <div
            id="ending-whiteout"
            class="ending-whiteout"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             JUMPSCARE VIDEO
             Asset AI will be added later
        =================================================== -->

        <div
            id="jumpscare-container"
            class="jumpscare-container"
            aria-hidden="true"
        >

            <video
                id="jumpscare-video"
                class="jumpscare-video"
                preload="auto"
                playsinline
            >
            </video>

        </div>


    </main>



    <!-- ==================================================
         SFX — SCENE 10 AUTHORIZE
    =================================================== -->

    <audio
        id="ending-hum"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/spaceship-hum.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-static"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/static-loop.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-rumble"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/deep-rumble.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-glitch-medium"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/glitch-medium.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-glitch-strong"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/glitch-strong.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-electrical"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/electrical-interference.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-low-impact"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/low-impact.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-whiteout-riser"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/whiteout-riser.wav"
            type="audio/mpeg"
        >
    </audio>



    <!-- ==================================================
         GSAP
    =================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>



    <!-- ==================================================
         SHARED ANIMATIONS
    =================================================== -->

    <script
        src="scene-10-animations.js"
    ></script>



    <!-- ==================================================
         AUTHORIZE LOGIC
    =================================================== -->

    <script
        src="scene-10-authorize.js"
    ></script>


</body>

</html>
