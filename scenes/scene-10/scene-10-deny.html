<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Integration Complete | The Lost Ship</title>


    <!-- Montserrat temporal -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS COMPARTIDO -->

    <link
        rel="stylesheet"
        href="scene-10.css"
    >

</head>


<body>


    <!-- ==================================================
         SCENE 10 — DENY ENDING
    =================================================== -->

    <main
        id="scene-10-deny"
        class="ending-scene ending-deny"
    >


        <!-- ==================================================
             BACKGROUND
        =================================================== -->

        <div
            id="ending-background"
            class="ending-background"
            aria-hidden="true"
        ></div>


        <div
            id="ending-scanlines"
            class="ending-scanlines"
            aria-hidden="true"
        ></div>


        <div
            id="ending-noise"
            class="ending-noise"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             MAIN FRAME
        =================================================== -->

        <section
            id="ending-frame"
            class="ending-frame"
        >


            <!-- ==============================================
                 MAIN CONTENT
            =============================================== -->

            <div
                id="ending-content"
                class="ending-content"
            >


                <section
                    id="deny-ending-message"
                    class="ending-message-section deny-message-section"
                    aria-live="polite"
                >


                    <!-- ======================================
                         LINE 01
                    ======================================= -->

                    <p
                        id="deny-message-01"
                        class="ending-message ending-message-question"
                    >
                    </p>



                    <!-- ======================================
                         LINE 02
                    ======================================= -->

                    <p
                        id="deny-message-02"
                        class="ending-message ending-message-access"
                    >
                    </p>



                    <!-- ======================================
                         LINE 03
                    ======================================= -->

                    <p
                        id="deny-message-03"
                        class="ending-message ending-message-integration"
                    >
                    </p>



                    <!-- ======================================
                         LINE 04
                    ======================================= -->

                    <p
                        id="deny-message-04"
                        class="ending-message ending-message-final"
                    >
                    </p>


                </section>


            </div>


        </section>



        <!-- ==================================================
             GHOST TEXT
             Used during final corruption
        =================================================== -->

        <div
            id="ghost-text-01"
            class="ending-ghost-text ending-ghost-text-01"
            aria-hidden="true"
        >
            WELCOME BACK.
        </div>


        <div
            id="ghost-text-02"
            class="ending-ghost-text ending-ghost-text-02"
            aria-hidden="true"
        >
            INTEGRATION COMPLETE
        </div>



        <!-- ==================================================
             INTERFERENCE LINES
        =================================================== -->

        <div
            id="interference-line-01"
            class="interference-line interference-line-01"
            aria-hidden="true"
        ></div>


        <div
            id="interference-line-02"
            class="interference-line interference-line-02"
            aria-hidden="true"
        ></div>


        <div
            id="interference-line-03"
            class="interference-line interference-line-03"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             GLITCH LAYERS
        =================================================== -->

        <div
            id="glitch-layer-01"
            class="glitch-layer glitch-layer-01"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-02"
            class="glitch-layer glitch-layer-02"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-03"
            class="glitch-layer glitch-layer-03"
            aria-hidden="true"
        ></div>


        <div
            id="glitch-layer-04"
            class="glitch-layer glitch-layer-04"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             FLASH
        =================================================== -->

        <div
            id="ending-flash"
            class="ending-flash"
            aria-hidden="true"
        ></div>



        <!-- ==================================================
             WHITEOUT
        =================================================== -->

        <div
            id="ending-whiteout"
            class="ending-whiteout"
            aria-hidden="true"
        ></div>


    </main>



    <!-- ==================================================
        SFX — SCENE 10 DENY
    =================================================== -->

    <audio
        id="ending-hum"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/spaceship-hum.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-static"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/static-loop.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-rumble"
        preload="auto"
        loop
    >
        <source
            src="../../assets/audio/sfx/deep-rumble.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-system-error"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/system-error.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-glitch-medium"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/glitch-medium.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-glitch-strong"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/glitch-strong.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-electrical"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/electrical-interference.wav"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-low-impact"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/low-impact.mp3"
            type="audio/mpeg"
        >
    </audio>


    <audio
        id="ending-whiteout-riser"
        preload="auto"
    >
        <source
            src="../../assets/audio/sfx/whiteout-riser.wav"
            type="audio/mpeg"
        >
    </audio>


    <!-- ==================================================
         GSAP
    =================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>



    <!-- ==================================================
         SHARED ANIMATIONS
    =================================================== -->

    <script
        src="scene-10-animations.js"
    ></script>



    <!-- ==================================================
         DENY LOGIC
    =================================================== -->

    <script
        src="scene-10-deny.js"
    ></script>


</body>

</html>
